<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2fb0" stop-opacity="0" />
      <stop offset="50%" stop-color="#ff6fd8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ff2fb0" stop-opacity="0" />
    </linearGradient>
    <style>
      .mono { font-family: 'Courier New', Consolas, monospace; }
      .title { fill: #ff7fd0; font-size: 15px; letter-spacing: 1px; }
      .label { fill: #ff9fd6; font-size: 13px; }
      .value { fill: #ffe6f5; font-size: 13px; }
      .dim    { fill: #7a2f57; font-size: 12px; }
    </style>
  </defs>

  <!-- fondo -->
  <rect x="0" y="0" width="900" height="420" rx="14" fill="#0a0410" />
  <rect x="4" y="4" width="892" height="412" rx="11" fill="none" stroke="#ff2fb0" stroke-width="1.5" filter="url(#glow)" />

  <!-- barra superior -->
  <circle cx="26" cy="26" r="5" fill="#ff5f56" />
  <circle cx="44" cy="26" r="5" fill="#ffbd2e" />
  <circle cx="62" cy="26" r="5" fill="#27c93f" />
  <text x="450" y="31" text-anchor="middle" class="mono dim">syntaxevve@github ~ $ ./profile-scan --live</text>
  <line x1="0" y1="46" x2="900" y2="46" stroke="#3a1030" stroke-width="1" />

  <!-- panel izquierdo -->
  <text x="30" y="72" class="mono title">VISUAL.MAP</text>
  <rect x="30" y="82" width="260" height="290" fill="none" stroke="#ff2fb0" stroke-opacity="0.5" stroke-width="1" />
  <image xlink:href="ascii_art.png" href="ascii_art.png" x="34" y="86" width="252" height="282" preserveAspectRatio="xMidYMid slice" opacity="0.95" />

  <!-- linea divisoria -->
  <line x1="330" y1="60" x2="330" y2="390" stroke="#3a1030" stroke-width="1" />

  <!-- panel derecho: SYSTEM.INFO -->
  <text x="352" y="72" class="mono title">SYSTEM.INFO</text>

  <text x="352" y="105" class="mono label">Subject</text>
  <text x="520" y="105" class="mono value">Evelin</text>

  <text x="352" y="130" class="mono label">Handle</text>
  <text x="520" y="130" class="mono value">@syntaxevve</text>

  <text x="352" y="155" class="mono label">Role</text>
  <text x="520" y="155" class="mono value">Computer Systems Eng. Student</text>

  <text x="352" y="180" class="mono label">Status</text>
  <text x="520" y="180" class="mono value">Learning · Building · Exploring</text>

  <text x="352" y="205" class="mono label">Interests</text>
  <text x="520" y="205" class="mono value">Cybersecurity, Astronomy, Music</text>

  <text x="352" y="230" class="mono label">Core.Lang</text>
  <text x="520" y="230" class="mono value">Java, Python, C#</text>

  <text x="352" y="255" class="mono label">ToolChain</text>
  <text x="520" y="255" class="mono value">Git, GitHub, Cisco, Steam</text>

  <text x="352" y="280" class="mono label">Contact</text>
  <text x="520" y="280" class="mono value">github.com/syntaxevve</text>

  <!-- linea de scan animada -->
  <rect x="30" y="340" width="840" height="3" fill="url(#scan)">
    <animate attributeName="y" values="60;390;60" dur="4s" repeatCount="indefinite" />
  </rect>

  <text x="450" y="405" text-anchor="middle" class="mono dim">generated locally · syntaxevve/syntaxevve</text>
</svg>
